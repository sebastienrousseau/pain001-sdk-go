# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Lint, build and unit-test the client (100% statement coverage) on the
# two Go releases the Go team supports, fuzz it, check the exported API
# against the last tag, then run the full regression (conformance kit,
# typed live tests, every example and the benchmark smoke) against a
# real `pain001 serve` installed from hash-pinned requirements.
name: CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # The job names are required status checks on main; renaming one
    # needs the branch protection updated in the same change.
    name: gofmt, vet, staticcheck, complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - run: make versions fmt-check vet staticcheck complexity

  vulncheck:
    name: govulncheck (dependency advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The module is stdlib-only, so govulncheck checks the standard
    # library of the newest supported Go against the Go vulnerability
    # database. It needs no secret and fails on any reachable advisory.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - run: make vulncheck

  test:
    name: build and unit tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The two releases the Go team supports; 1.26 is the go.mod floor.
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: make build test

  fuzz:
    name: fuzz response decoding (30s per target)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Each target in fuzz_test.go runs for 30 seconds against arbitrary
    # server responses. A crash fails the job and the failing input is
    # uploaded; commit it under testdata/fuzz as a regression.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - run: make fuzz FUZZTIME=30s
      - name: Failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: testdata/fuzz
          if-no-files-found: ignore

  api:
    name: API-breakage check (gorelease)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gorelease compares the exported API with the last release tag; a
    # no-op until the first tag exists (scripts/api-check.sh).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - run: scripts/api-check.sh

  conformance:
    name: conformance kit against pain001 serve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # make regression installs the server from hash-pinned requirements
    # into a temporary venv, starts it on loopback with an API key, runs
    # make check against it (the conformance kit, the typed live tests
    # and every example) and smoke-runs every benchmark, then stops it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - run: make regression
