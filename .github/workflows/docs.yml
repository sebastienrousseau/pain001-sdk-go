# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# The user manual: MkDocs Material from docs/ (mkdocs.yml), built with
# --strict on every push and pull request, so a broken link, a missing
# page or a bad snippet include fails CI. On main it is deployed to
# GitHub Pages with the official actions (AGENTS.md 7.1.3).
#
# Deploying needs two settings the maintainer makes once: the Pages
# source set to "GitHub Actions" (build_type workflow), and the
# repository variable PAGES_ENABLED=true. Until then the deploy job is
# skipped and only the build runs. See DEVELOPMENT.md, "The manual".
name: Docs

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: manual (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install MkDocs Material from hash-pinned requirements
        run: |
          python -m venv "$RUNNER_TEMP/docs"
          "$RUNNER_TEMP/docs/bin/python" -m pip install --quiet --require-hashes -r ci/docs-requirements.txt
      - name: Build the manual
        run: '"$RUNNER_TEMP/docs/bin/mkdocs" build --strict'
      - name: Every page carries the author link
        run: scripts/check-site-footer.sh site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
