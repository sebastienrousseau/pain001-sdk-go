# SPDX-License-Identifier: Apache-2.0 OR MIT
# The pain001 server pin in ci/server-requirements.in is ignored on
# purpose: it moves with the suite release, by hand. Its transitive
# dependencies and the docs and lint tool locks in ci/ are updated.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    reviewers:
      - "sebastienrousseau"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "sebastienrousseau"
    labels:
      - "ci/cd"
      - "automated"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/ci"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "pain001"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "build(deps):"
    groups:
      python-tools:
        patterns:
          - "*"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "automated"
