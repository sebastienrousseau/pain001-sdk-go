#
# pre-commit hooks mirroring the fast CI gates. Install once with
# `pre-commit install`; run everything with `pre-commit run --all-files`.
# The hooks call the repository's own make targets and scripts (system
# tools at the versions the Makefile pins), so they cannot drift from CI.
repos:
  - repo: local
    hooks:
      - id: versions
        name: verify-release-versions
        entry: scripts/verify-release-versions
        language: system
        pass_filenames: false
      - id: gofmt
        name: gofmt
        entry: make fmt-check
        language: system
        pass_filenames: false
        types: [go]
      - id: vet-staticcheck-complexity
        name: go vet, staticcheck, gocyclo, gocognit
        entry: make vet staticcheck complexity
        language: system
        pass_filenames: false
        types: [go]
      - id: markdownlint
        name: markdownlint-cli2
        entry: npx --yes markdownlint-cli2@0.23.3
        language: system
        types: [markdown]
      - id: codespell
        name: codespell
        entry: codespell
        language: system
        pass_filenames: false
      - id: reuse
        name: reuse lint
        entry: reuse lint
        language: system
        pass_filenames: false
